name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test backend
        run: cd bibliotheque-backend && mvn -B clean test

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: bibliotheque-frontend/package-lock.json

      - name: Install dependencies
        run: cd bibliotheque-frontend && npm ci

      - name: Run unit tests
        run: cd bibliotheque-frontend && npx ng test --no-watch --browsers=ChromeHeadlessNoSandbox
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable

      - name: Build for production
        run: cd bibliotheque-frontend && npx ng build --configuration production

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f bibliotheque-backend/Dockerfile -t bibliotheque-backend .

      - name: Build frontend image
        run: docker build -f bibliotheque-frontend/Dockerfile -t bibliotheque-frontend ./bibliotheque-frontend
