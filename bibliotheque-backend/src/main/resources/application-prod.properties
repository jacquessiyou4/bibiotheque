# Profil de production : activé par SPRING_PROFILES_ACTIVE=prod (voir .env.example).
# Chargé en plus de application.properties ; ne surcharge que ce qui doit
# changer hors développement.

# Aucune information interne dans les réponses d'erreur générées par Spring
# (routes inconnues, 405...). Les erreurs de l'API passent déjà par
# GlobalExceptionHandler, qui ne renvoie qu'un message métier et un requestId.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Santé : état global seulement, sans détail des composants (base, disque...).
management.endpoint.health.show-details=never

# Swagger UI et le contrat OpenAPI ne sont pas publiés en production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
