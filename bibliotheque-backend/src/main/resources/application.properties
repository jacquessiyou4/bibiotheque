server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/bibliotheque
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

# --- Keycloak ---
# Valeurs par défaut pour un lancement hors Docker (Keycloak publié sur
# localhost:8081) ; docker-compose les surcharge via APP_KEYCLOAK_*.
app.keycloak.jwks-uri=http://localhost:8081/realms/bibliotheque/protocol/openid-connect/certs
app.keycloak.issuer-local=http://localhost:8081/realms/bibliotheque
app.keycloak.issuer-internal=http://keycloak:8080/realms/bibliotheque
# Endpoint token appelé PAR LE BACKEND (POST /auth/token) :
# docker-compose le surcharge avec l'adresse interne keycloak:8080.
app.keycloak.token-uri=http://localhost:8081/realms/bibliotheque/protocol/openid-connect/token
app.keycloak.client-id=bibliotheque-frontend

# --- Swagger UI ---
# « Authorize » > keycloak : client public du realm (pas de secret), le même
# que le frontend Angular. La connexion survit au rechargement de la page.
springdoc.swagger-ui.oauth.client-id=bibliotheque-frontend
springdoc.swagger-ui.persist-authorization=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

server.error.include-message=always

# --- Logs ---
# Chaque ligne affiche le X-Request-ID posé dans le MDC par SecurityAuditFilter
# (vide hors requête HTTP) : on retrouve toutes les lignes d'une même requête.
logging.pattern.level=%5p [requestId=%X{requestId:-}]
