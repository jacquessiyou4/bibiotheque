server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/bibliotheque
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# Pas de session JPA ouverte pendant le rendu HTTP : les données sont chargées
# dans les services, une requête cachée depuis un contrôleur échoue au lieu de passer.
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Dates au format ISO-8601 (2026-09-14T10:15:30), relisibles par tout client.
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Keycloak ---
# Valeurs par défaut pour un lancement hors Docker (Keycloak publié sur
# localhost:8081) ; docker-compose les surcharge via APP_KEYCLOAK_*.
app.keycloak.jwks-uri=http://localhost:8081/realms/bibliotheque/protocol/openid-connect/certs
app.keycloak.issuer-local=http://localhost:8081/realms/bibliotheque
app.keycloak.issuer-internal=http://keycloak:8080/realms/bibliotheque
# Endpoint token appelé PAR LE BACKEND (POST /auth/token) :
# docker-compose le surcharge avec l'adresse interne keycloak:8080.
app.keycloak.token-uri=http://localhost:8081/realms/bibliotheque/protocol/openid-connect/token
app.keycloak.client-id=bibliotheque-frontend

# --- Swagger UI ---
# « Authorize » > keycloak : client public du realm (pas de secret), le même
# que le frontend Angular. La connexion survit au rechargement de la page.
springdoc.swagger-ui.oauth.client-id=bibliotheque-frontend
springdoc.swagger-ui.persist-authorization=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
# Sondes séparées : liveness (le processus répond) et readiness (prêt à servir).
# Le healthcheck Docker attend readiness : pas de trafic avant la fin des migrations.
management.endpoint.health.probes.enabled=true
# Histogramme des temps de réponse : percentiles p50/p95/p99 calculés par
# Prometheus (tableau de bord Grafana, alerte LatenceP95Elevee).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s
# Identifiants HTTP Basic de Prometheus (voir AccesMetriques) : vide = accès réservé aux administrateurs.
app.metriques.utilisateur=prometheus
app.metriques.mot-de-passe=${METRICS_PASSWORD:}

# --- Règles de prêt (ReglesBibliotheque) ---
app.bibliotheque.duree-emprunt-jours=7
app.bibliotheque.duree-reservation-jours=7
app.bibliotheque.reservations-actives-max=3

# --- Arrêt propre ---
# docker compose stop : les requêtes en cours (un emprunt, un retour) se terminent
# avant l'arrêt, dans la limite de 20 s ; les nouvelles sont refusées.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

server.error.include-message=always

# --- Logs ---
# Chaque ligne affiche le X-Request-ID posé dans le MDC par SecurityAuditFilter
# (vide hors requête HTTP) : on retrouve toutes les lignes d'une même requête.
logging.pattern.level=%5p [requestId=%X{requestId:-}]
