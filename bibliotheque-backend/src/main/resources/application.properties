server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bibliotheque
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.show-sql = true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.ddl-auto=update
hibernate.format_sql=true;

# Sans ceci, les réponses d'erreur (400/404/409) n'exposent pas le message de
# l'exception : le corps JSON garde juste "message":"No message available".
# Les erreurs métier (RG-01 à RG-06) doivent nommer la règle enfreinte.
server.error.include-message=always