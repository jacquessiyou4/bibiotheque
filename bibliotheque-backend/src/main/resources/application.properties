server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:3306/bibliotheque
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql = true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
hibernate.format_sql=true

# Sans ceci, les réponses d'erreur (400/404/409) n'exposent pas le message de
# l'exception : le corps JSON garde juste "message":"No message available".
# Les erreurs métier (RG-01 à RG-06) doivent nommer la règle enfreinte.
server.error.include-message=always
# --- Keycloak (OAuth2 resource server) ---
# Surchargées par docker-compose.yml à l'intérieur du réseau Docker.
app.keycloak.jwks-uri=http://localhost:8081/realms/bibliotheque/protocol/openid-connect/certs
app.keycloak.issuer-local=http://localhost:8081/realms/bibliotheque
app.keycloak.issuer-internal=http://localhost:8081/realms/bibliotheque
