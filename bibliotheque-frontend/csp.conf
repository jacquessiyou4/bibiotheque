# Valeur par défaut (API sur http://localhost:8080), copiée dans l'image.
# Régénérée au démarrage du conteneur par docker-entrypoint.d/40-env-config.sh
# à partir de API_URL.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' http://localhost:8080; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
