# Politique de cache selon l'URI finale (après la redirection interne de
# try_files, les routes Angular comme /books sont servies par /index.html) :
#  - index.html : « no-cache », le navigateur revalide à chaque visite et
#    récupère donc le nouveau bundle après un redéploiement (sinon il peut
#    garder l'ancienne application en cache, cf. en-tête du menu Admin) ;
#  - assets/env.js : « no-store », régénéré à chaque démarrage du conteneur
#    (voir docker-entrypoint.d/40-env-config.sh) ;
#  - le reste (main.<hash>.js, styles.<hash>.css…) : aucun en-tête, le nom
#    change à chaque build, le cache normal est sans risque.
map $uri $bibliotheque_cache_control {
    /index.html     "no-cache";
    /assets/env.js  "no-store";
    default         "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de sécurité. Tous les add_header restent au niveau server :
    # un add_header dans un bloc location masquerait ceux-ci pour ce bloc.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Valeur vide (fichiers à hash) : nginx n'envoie pas l'en-tête.
    add_header Cache-Control $bibliotheque_cache_control always;

    # Routage côté client : toute URL inconnue de nginx retombe sur index.html,
    # Angular Router décide ensuite quel composant afficher.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
