server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Routage côté client : toute URL inconnue de nginx retombe sur index.html,
    # Angular Router décide ensuite quel composant afficher.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ce fichier est régénéré à chaque démarrage du conteneur (voir
    # docker-entrypoint.d/40-env-config.sh) : jamais de cache dessus.
    location = /assets/env.js {
        add_header Cache-Control "no-store";
    }
}
