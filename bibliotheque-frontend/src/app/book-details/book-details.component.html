<h2>{{ 'bookDetails.borrowHistoryOf' | translate }} {{ book.bookName }}</h2>
<table class="table table-info table-striped">
    <thead>
        <tr>
            <th> {{ 'history.userId' | translate }} </th>
            <th> {{ 'history.issueDate' | translate }} </th>
            <th> {{ 'history.returnDate' | translate }} </th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let borrower of borrow">
            <!-- <td> {{ getUserData(borrower.userId) }} </td> -->
            <td> {{ borrower.userId }} </td>
            <td> {{ borrower.issueDate }} </td>
            <td *ngIf="borrower.returnDate != null"> {{ borrower.returnDate }} </td>
            <td *ngIf="borrower.returnDate == null"> {{ 'history.notReturned' | translate }} </td>
        </tr>
    </tbody>
</table>
