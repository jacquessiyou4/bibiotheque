<div class="container col-md-6 offset-mid-3">
    <h3 class="text-center"> {{ 'updateUser.title' | translate }} </h3>
    <form (ngSubmit) = "onSubmit()" autocomplete="off">

        <div class="form-group">
            <label style="margin-bottom: 10px"> {{ 'registration.name' | translate }} </label>
            <input type="text" class="form-control" style="margin-bottom: 10px" id="name" [(ngModel)] = "user.name" name="name">
        </div>

        <div class="form-group">
            <label style="margin-bottom: 10px"> {{ 'registration.username' | translate }} </label>
            <input type="text" class="form-control" style="margin-bottom: 10px" id="username" [(ngModel)] = "user.username" name="username">
        </div>

        <div class="form-group">
            <label style="margin-bottom: 10px"> {{ 'registration.role' | translate }} </label>
            <select class="form-select" style="margin-bottom: 10px" id="role" [(ngModel)]="selectedRole" name="role">
                <option value="Admin">Admin</option>
                <option value="User">User</option>
            </select>
        </div>

        <button class="btn btn-success" type="submit"> {{ 'form.submit' | translate }} </button>
    </form>
</div>
