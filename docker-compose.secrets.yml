# Mots de passe lus dans des fichiers (secrets Docker) plutôt que dans .env.
#
#   1. Créer les fichiers (une valeur par fichier, sans retour à la ligne final) :
#        mkdir -p secrets && chmod 700 secrets
#        openssl rand -base64 32 | tr -d '\n' > secrets/postgres_password
#        openssl rand -base64 32 | tr -d '\n' > secrets/keycloak_db_password
#        openssl rand -base64 32 | tr -d '\n' > secrets/keycloak_admin_password
#        openssl rand -base64 32 | tr -d '\n' > secrets/grafana_admin_password
#        chmod 600 secrets/*
#   2. Démarrer avec les deux fichiers compose :
#        docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Les valeurs n'apparaissent plus dans `docker inspect`, dans l'environnement
# des processus ni dans .env. Le dossier secrets/ n'est jamais versionné.
# Voir docs/RUNBOOK.md, section « Changer un secret ».

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

services:
  db:
    # L'image officielle PostgreSQL lit nativement les variables *_FILE.
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  backend:
    # Spring Boot lit /run/secrets/ comme une arborescence de propriétés
    # (configtree) : le fichier nommé spring.datasource.password devient
    # la propriété du même nom.
    environment:
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - source: postgres_password
        target: spring.datasource.password

  keycloak-db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - keycloak_db_password

  keycloak:
    # Keycloak 24 ne connaît pas les variables *_FILE : le mot de passe est lu
    # dans le fichier juste avant le lancement, sans passer par .env.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        export KC_DB_PASSWORD="$$(cat /run/secrets/keycloak_db_password)"
        KEYCLOAK_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        && exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_DB_PASSWORD: ""
      KEYCLOAK_ADMIN_PASSWORD: ""
    secrets:
      - keycloak_db_password
      - keycloak_admin_password

  backup:
    # Les scripts de sauvegarde lisent les mêmes fichiers.
    environment:
      APP_DB_PASSWORD_FILE: /run/secrets/postgres_password
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - postgres_password
      - keycloak_db_password

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ""
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
