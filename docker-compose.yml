services:
  db:
    image: postgres:16-alpine
    container_name: bibliotheque-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # L'entrypoint Postgres démarre en root, corrige les droits du volume
    # puis bascule sur l'utilisateur postgres : sans ces capacités il échoue
    # (« failed switching to 'postgres': operation not permitted »).
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bibliotheque}
      POSTGRES_USER: ${POSTGRES_USER:-bibliotheque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bibliotheque}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready répond dès que Postgres ACCEPTE des connexions, pas
      # seulement quand le conteneur a démarré : c'est la différence avec
      # un simple `depends_on` (voir README / SEANCE-1, point 2).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bibliotheque} -d ${POSTGRES_DB:-bibliotheque}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Le backend ne contient plus le build Angular (servi par le service
      # frontend) : le contexte se limite à son propre dossier.
      context: ./bibliotheque-backend
    container_name: bibliotheque-backend
    restart: unless-stopped
    # Laisse à Spring Boot le temps de terminer les requêtes en cours
    # (server.shutdown=graceful, 20 s) avant l'arrêt forcé.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    environment:
      # Ces variables surchargent application.properties (qu'on ne modifie
      # pas) grâce au "relaxed binding" de Spring Boot : chaque propriété
      # spring.xxx.yyy a son équivalent SPRING_XXX_YYY en env var.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bibliotheque}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bibliotheque}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bibliotheque}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      # --- Intégration Keycloak (OAuth2 / OpenID Connect) ---
      # Le backend (resource server) récupère les clés publiques de Keycloak
      # en interne via le réseau Docker (keycloak:8080), mais les jetons émis
      # pour le NAVIGATEUR portent l'issuer local (http://localhost:8081/…) :
      # l'issuer interne ET l'issuer local sont donc acceptés.
      APP_KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/bibliotheque/protocol/openid-connect/certs
      APP_KEYCLOAK_ISSUER_LOCAL: http://localhost:${KEYCLOAK_PORT:-8081}/realms/bibliotheque
      APP_KEYCLOAK_ISSUER_INTERNAL: http://keycloak:8080/realms/bibliotheque
      # Endpoint token appelé par le backend lui-même (POST /auth/token) :
      # adresse interne, les jetons portent l'issuer interne.
      APP_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/bibliotheque/protocol/openid-connect/token
      # Origines autorisées en CORS (le frontend nginx est servi sur 4200).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Vide en local. « prod » : erreurs sans détail interne, Swagger désactivé
      # (voir bibliotheque-backend/src/main/resources/application-prod.properties).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Mot de passe HTTP Basic de Prometheus sur /actuator/prometheus (vide : lecture réservée aux administrateurs).
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # L'image eclipse-temurin:8-jre-alpine fournit wget (busybox) mais pas curl.
      # readiness : prêt à servir (migrations Flyway terminées, contexte démarré).
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Service frontend séparé (nginx) --------------------------------------
  # Le frontend Angular est servi par nginx sur le port 4200.
  # L'URL de l'API et de Keycloak sont injectées au démarrage via
  # docker-entrypoint.d/40-env-config.sh (assets/env.js).
  # Le navigateur (pas le conteneur) accède aux services via localhost.
  frontend:
    build:
      context: ./bibliotheque-frontend
    container_name: bibliotheque-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Le maître nginx (root) prépare /var/cache/nginx puis lance ses workers
    # sous l'utilisateur nginx : sans ces capacités il s'arrête sur
    # « chown("/var/cache/nginx/client_temp", 101) failed ».
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    environment:
      API_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 et non localhost : dans l'image alpine, localhost se résout
      # d'abord en ::1 alors que nginx n'écoute qu'en IPv4 (conteneur « unhealthy »).
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:16-alpine
    container_name: bibliotheque-keycloak-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Mêmes capacités minimales que le service db (voir ci-dessus).
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      # Même pattern que le service db : pg_isready répond dès que la base
      # accepte les connexions, pas seulement quand le conteneur a démarré.
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: bibliotheque-keycloak
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # start-dev : mode développement (H2 remplacé par la base ci-dessous,
    # HTTPS désactivé, logs verbeux). --import-realm charge le realm fourni.
    command: ["start-dev", "--import-realm"]
    environment:
      # Compte admin de bootstrap, créé au PREMIER démarrage uniquement.
      # Keycloak 24 lit KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD ; les variables
      # KC_BOOTSTRAP_ADMIN_* n'existent qu'à partir de Keycloak 26.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      # Keycloak stocke son propre état (realms, clients, users) dans une
      # base PostgreSQL dédiée, distincte de celle de l'application.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # (En dev mode le port de gestion n'est pas actif : le healthcheck
      # ci-dessous passe par le port HTTP principal 8080.)
      KC_MANAGEMENT_PORT: 9000
      # Les endpoints /health, /health/ready, /health/live ne sont PAS
      # exposés par défaut : il faut les activer explicitement.
      KC_HEALTH_ENABLED: "true"
    ports:
      # 8080 du conteneur est publié sur 8081 de la machine pour ne pas
      # entrer en conflit avec le backend (8080).
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      # Realm "bibliotheque" importé automatiquement au premier démarrage :
      # voit ./keycloak/realm-bibliotheque.json
      - ./keycloak/realm-bibliotheque.json:/opt/keycloak/data/import/realm-bibliotheque.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # En mode dev (start-dev), /health/ready est servi sur le port HTTP
      # principal (8080), PAS sur le port de gestion 9000. On fait un
      # GET HTTP brut via /dev/tcp (l'image n'embarque ni curl ni wget).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
  # --- Reverse proxy HTTPS (optionnel) --------------------------------------
  # Caddy termine le TLS automatiquement (certificats Let's Encrypt
  # en prod, certificats auto-signés en dev local). Pour activer :
  #   1. Utiliser le profile https : docker compose --profile https up
  #   2. Modifier les ports des services backend/frontend pour ne plus
  #      les exposer directement (supprimer les lignes `ports:`)
  #   3. Rediriger le trafic via Caddy sur les ports 80/443
  #
  caddy:
    image: caddy:2-alpine
    container_name: bibliotheque-caddy
    restart: unless-stopped
    profiles: ["https"]
    # Seul service exposé sur Internet quand le profile https est actif :
    # même durcissement que les autres, plus NET_BIND_SERVICE pour écouter
    # sur 80/443 (ports < 1024).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      # API d'administration de Caddy (écoute sur 127.0.0.1:2019 dans le conteneur).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - keycloak

  # --- Sauvegardes (optionnel) -----------------------------------------------
  # docker compose --profile ops up -d backup      : sauvegarde chaque nuit
  # docker compose --profile ops run --rm backup once : sauvegarde immédiate
  # Restauration et vérification : voir docs/RUNBOOK.md.
  backup:
    image: postgres:16-alpine
    container_name: bibliotheque-backup
    restart: unless-stopped
    profiles: ["ops"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    entrypoint: ["/bin/sh", "/ops/sauvegarde.sh"]
    command: ["daemon"]
    environment:
      APP_DB_HOST: db
      APP_DB_NAME: ${POSTGRES_DB:-bibliotheque}
      APP_DB_USER: ${POSTGRES_USER:-bibliotheque}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-bibliotheque}
      KC_DB_HOST: keycloak-db
      KC_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Heure (UTC) de la sauvegarde quotidienne et nombre de jours conservés.
      BACKUP_HEURE: ${BACKUP_HEURE:-02}
      BACKUP_JOURS_CONSERVES: ${BACKUP_JOURS_CONSERVES:-7}
    volumes:
      - ./ops/backup:/ops:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
      keycloak-db:
        condition: service_healthy

  # --- Observabilité (optionnel) ---------------------------------------------
  # docker compose --profile observability up -d
  #   Prometheus : http://localhost:9090   Grafana : http://localhost:3000
  # Le tableau de bord « Bibliothèque — santé de l'API » est provisionné.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bibliotheque-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    # Le mot de passe du scrape (METRICS_PASSWORD) est écrit dans un fichier lu par
    # prometheus.yml (basic_auth.password_file), puis Prometheus démarre.
    # Vérifié au démarrage du conteneur et non par « ${VAR:?} » : Compose évalue
    # cette syntaxe pour tous les services, profil inactif compris, et bloquerait
    # alors tout « docker compose up » sans METRICS_PASSWORD.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -z "$$METRICS_PASSWORD" ]; then
        echo "Définir METRICS_PASSWORD dans .env pour le profil observability" >&2; exit 1; fi;
        printf '%s' "$$METRICS_PASSWORD" > /tmp/metrics_password
        && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    environment:
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alertes.yml:/etc/prometheus/alertes.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    container_name: bibliotheque-grafana
    restart: unless-stopped
    profiles: ["observability"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db_data:
  keycloak_db_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
