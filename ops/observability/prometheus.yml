# Prometheus : collecte des métriques du backend (profil compose « observability »).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertes.yml

scrape_configs:
  - job_name: bibliotheque-backend
    metrics_path: /actuator/prometheus
    # Prometheus ne peut pas obtenir de jeton Keycloak : il s'authentifie en
    # HTTP Basic (AccesMetriques côté backend). Le mot de passe vient de la
    # variable METRICS_PASSWORD, écrite dans ce fichier au démarrage du conteneur.
    basic_auth:
      username: prometheus
      password_file: /tmp/metrics_password
    static_configs:
      - targets: ["backend:8080"]
